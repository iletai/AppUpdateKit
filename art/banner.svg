<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Glow circles -->
  <circle cx="200" cy="180" r="140" fill="#38BDF8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="180" r="140" fill="#C084FC" opacity="0.12" filter="url(#glow)" />

  <!-- Logo Icon -->
  <g transform="translate(100, 100)">
    <rect width="160" height="160" rx="36" fill="url(#accent)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
    <!-- Arrow cycle / update icon -->
    <path d="M80 44 C58 44 40 62 40 84 C40 96 46 107 55 114 L65 104 C59 99 55 92 55 84 C55 70 66 59 80 59 L80 72 L105 52 L80 32 Z" fill="#38BDF8" />
    <path d="M80 124 C102 124 120 106 120 84 C120 72 114 61 105 54 L95 64 C101 69 105 76 105 84 C105 98 94 109 80 109 L80 96 L55 116 L80 136 Z" fill="#C084FC" />
  </g>

  <!-- Typography -->
  <g transform="translate(300, 140)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#brand)" letter-spacing="-0.03em">
      AppUpdateKit
    </text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="-0.01em">
      Zero-Dependency, Fail-Safe App Update &amp; Maintenance Engine for Swift
    </text>

    <!-- Pills / Badges -->
    <g transform="translate(0, 85)">
      <!-- Badge 1: 0 Dependencies -->
      <g>
        <rect width="165" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10B981" />
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">0 Dependencies</text>
      </g>
      <!-- Badge 2: Swift 6 Ready -->
      <g transform="translate(180, 0)">
        <rect width="145" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#F59E0B" />
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Swift 6 Ready</text>
      </g>
      <!-- Badge 3: Headless & UI Optional -->
      <g transform="translate(340, 0)">
        <rect width="190" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#38BDF8" />
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Headless &amp; UI Optional</text>
      </g>
      <!-- Badge 4: microCMS & JSON -->
      <g transform="translate(545, 0)">
        <rect width="165" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#A855F7" />
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">microCMS / JSON</text>
      </g>
    </g>
  </g>
</svg>
